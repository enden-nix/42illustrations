<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Illustration Chart</title>
  
  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  
  <!-- Google Fonts: Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* === テーマ変数とアクセントカラー === */
    :root {
      --accent: #FF8C69; /* サーモンピンク */
      --accent-hover: #FF7043;
      
      /* ライトモード */
      --bg-color: #f4f4f4;
      --sidebar-bg: #ffffff;
      --text-color: #111111;
      --border-color: #dddddd;
      --slot-bg: #eaeaea;
      --slot-border: #cccccc;
      --canvas-bg: #ffffff;
    }

    body.dark-mode {
      --bg-color: #121212;
      --sidebar-bg: #1e1e1e;
      --text-color: #ffffff;
      --border-color: #333333;
      --slot-bg: #262626;
      --slot-border: #444444;
      --canvas-bg: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Zen Maru Gothic', sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-color); 
      display: flex; 
      height: 100vh; 
      overflow: hidden; 
      transition: background-color 0.3s, color 0.3s; 
    }

    /* --- 左サイドバー --- */
    .sidebar { width: 320px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); padding: 25px 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; overflow-y: auto; transition: background-color 0.3s, border-color 0.3s; }
    .sidebar h1 { font-size: 20px; font-weight: 900; letter-spacing: 1px; color: var(--text-color); border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-bottom: 5px; }
    
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .sidebar input[type="text"], .sidebar select { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border-color); color: var(--text-color); border-radius: 4px; outline: none; transition: 0.2s; font-size: 14px; font-family: inherit; }
    .sidebar input[type="text"]:focus, .sidebar select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 140, 105, 0.2); }
    
    .btn { padding: 12px 15px; font-family: inherit; background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-weight: 700; transition: 0.2s; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { background-color: rgba(136, 136, 136, 0.1); }
    
    .btn-primary { background-color: var(--accent); color: #fff; border: none; }
    .btn-primary:hover { background-color: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255, 140, 105, 0.3); }

    .toggle-row { display: flex; gap: 10px; }
    .toggle-btn { flex: 1; padding: 10px; font-size: 12px; font-weight: 700; font-family: inherit; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); border-radius: 4px; cursor: pointer; transition: 0.2s; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* --- 右メイン（グリッド） --- */
    .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .chart-container { background-color: var(--canvas-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 950px; transition: background-color 0.3s; }
    body.dark-mode .chart-container { box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    
    /* タイトルのウェイトを少し細く (900 -> 700) */
    .chart-title { text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 25px; color: var(--text-color); letter-spacing: 2px; }

    .grid-section { display: grid; gap: 8px; margin-bottom: 8px; }
    .grid-3x3 { grid-template-columns: repeat(3, 1fr); max-width: 600px; margin: 0 auto; }
    .grid-5x5 { grid-template-columns: repeat(5, 1fr); max-width: 750px; margin: 0 auto; }
    .grid-top { grid-template-columns: repeat(5, 1fr); }
    .grid-mid { grid-template-columns: repeat(6, 1fr); }
    .grid-bot { grid-template-columns: repeat(10, 1fr); }

    /* --- セル（枠）のデザイン --- */
    .slot { 
      aspect-ratio: 1 / 1; 
      background-color: var(--slot-bg); 
      border: 2px dashed var(--slot-border); 
      border-radius: 6px; 
      position: relative; 
      cursor: pointer; 
      overflow: hidden; 
      background-size: cover; 
      background-position: center; 
      transition: transform 0.15s, border-color 0.2s, border-style 0.2s; 
    }
    
    /* 共通: ホバー時にサーモンピンクの枠を出す */
    .slot:hover { 
      border-color: var(--accent); 
      border-style: solid; 
    }
    
    /* 空枠: ホバー時に薄いグレーの大きな＋アイコンを表示 */
    .slot:not(.has-image)::after {
      content: '+';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 400;
      color: rgba(150, 150, 150, 0.4);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none; /* クリックの邪魔にならないように */
    }
    .slot:not(.has-image):hover::after {
      opacity: 1;
    }

    /* 画像あり枠: 画像サイズを保つため枠線を透明にして幅を確保し、ホバーで色をつける */
    .slot.has-image { 
      border: 2px solid transparent; 
      cursor: grab; 
    }
    .slot.has-image:active { 
      cursor: grabbing; 
      transform: scale(0.98); 
    }
    .slot.has-image:hover { 
      border-color: var(--accent); 
    }
    .slot.drag-over { 
      border: 3px solid var(--accent); 
      transform: scale(1.05); 
      z-index: 2; 
    }
    
    /* 削除ボタン */
    .delete-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 14px; font-weight: bold; display: none; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .delete-btn:hover { background: var(--accent); }
    .slot.has-image:hover .delete-btn { display: flex; }

    /* --- モーダル --- */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal-content { background: var(--sidebar-bg); color: var(--text-color); padding: 25px; border-radius: 12px; max-width: 500px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    
    /* URL入力欄を少し大きく */
    #urlInput {
      padding: 14px 16px;
      font-size: 16px;
      border-width: 2px;
    }

    .crop-container { width: 100%; height: 350px; margin: 20px 0; background: #000; border-radius: 4px; overflow: hidden; }
  </style>
</head>
<body class="light-mode">

  <!-- サイドバー -->
  <div class="sidebar">
    <h1>Illustration Chart</h1>
    
    <div class="toggle-row">
      <button class="toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <span data-i18n="themeLight">Light</span>
      </button>
      <button class="toggle-btn" onclick="toggleLanguage()" id="langToggleBtn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
        <span id="langLabel">EN</span>
      </button>
    </div>

    <div class="form-group">
      <label data-i18n="layoutLabel">Layout</label>
      <select id="layoutSelect" onchange="changeLayout()">
        <option value="42" data-i18n="layout42">Topsters 42 (10+12+20)</option>
        <option value="9" data-i18n="layout9">3×3 (9 slots)</option>
        <option value="25" data-i18n="layout25">5×5 (25 slots)</option>
      </select>
    </div>

    <div class="form-group">
      <label data-i18n="titleLabel">Title</label>
      <input type="text" id="titleInput" data-i18n-placeholder="titlePlaceholder" oninput="updateTitle()">
    </div>

    <button class="btn btn-primary" onclick="openAddModal()" style="margin-top: 10px;">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
      <span data-i18n="addBtn">Add Image</span>
    </button>
    
    <hr style="border-color: var(--border-color); margin: 5px 0;">

    <button class="btn" onclick="exportCanvas()" style="border-color: var(--accent); color: var(--accent);">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      <span data-i18n="exportBtn">Export as PNG</span>
    </button>
    <button class="btn" onclick="clearAll()" style="color: #999; font-size: 12px; padding: 8px;" data-i18n="clearBtn">Clear All</button>
  </div>

  <!-- メインコンテンツ -->
  <div class="main-content">
    <div class="chart-container" id="chartContainer">
      <div class="chart-title" id="chartTitle"></div>
      <div id="gridArea"></div>
    </div>
  </div>

  <!-- モーダル -->
  <div id="modal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalTitle" style="border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 15px; font-weight: 700;"></h3>
      <input type="text" id="urlInput" data-i18n-placeholder="urlPlaceholder">
      <button class="btn btn-primary" onclick="fetchAndCrop()" style="margin-top: 10px; width: 100%;" data-i18n="loadBtn">Load</button>
      
      <div class="crop-container" id="cropBox" style="display:none;">
        <img id="cropImage" src="">
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
        <button class="btn" onclick="closeModal()" data-i18n="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="confirmBtn" style="display:none;" onclick="applyCrop()" data-i18n="cropBtn">Confirm Crop</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <script>
    const WORKER_URL = 'https://42illustrations.enden-kpc.workers.dev';

    // --- 多言語辞書 (i18n) ---
    const dict = {
      ja: {
        themeLight: "ライト",
        themeDark: "ダーク",
        layoutLabel: "レイアウト",
        layout42: "Topsters 42枚 (10 + 12 + 20)",
        layout9: "3×3 (9枚)",
        layout25: "5×5 (25枚)",
        titleLabel: "タイトル",
        titlePlaceholder: "私を構成するイラスト",
        addBtn: "画像を追加",
        exportBtn: "画像として保存 (PNG)",
        clearBtn: "すべてクリア",
        modalTitle: "画像を追加",
        urlPlaceholder: "X(Twitter) または PixivのURL",
        loadBtn: "読み込む",
        cancelBtn: "キャンセル",
        cropBtn: "切り抜き確定",
        alertUrl: "URLを入力してください",
        alertClear: "現在のレイアウト内の画像をクリアしますか？"
      },
      en: {
        themeLight: "Light",
        themeDark: "Dark",
        layoutLabel: "Layout",
        layout42: "Topsters 42 (10 + 12 + 20)",
        layout9: "3×3 (9 slots)",
        layout25: "5×5 (25 slots)",
        titleLabel: "Title",
        titlePlaceholder: "My Illustration Chart",
        addBtn: "Add Image",
        exportBtn: "Export as PNG",
        clearBtn: "Clear All",
        modalTitle: "Add Image",
        urlPlaceholder: "Paste X(Twitter) or Pixiv URL",
        loadBtn: "Load",
        cancelBtn: "Cancel",
        cropBtn: "Confirm Crop",
        alertUrl: "Please enter a valid URL.",
        alertClear: "Are you sure you want to clear all images?"
      }
    };

    let currentLang = 'ja'; 
    
    const LAYOUTS = {
      '9': { total: 9, sections: [{ count: 9, cols: 3, className: 'grid-3x3' }] },
      '25': { total: 25, sections: [{ count: 25, cols: 5, className: 'grid-5x5' }] },
      '42': { total: 42, sections: [{ count: 10, cols: 5, className: 'grid-top' }, { count: 12, cols: 6, className: 'grid-mid' }, { count: 20, cols: 10, className: 'grid-bot' }] }
    };

    const MAX_SLOTS = 42;
    let slotsData = new Array(MAX_SLOTS).fill(null);
    let currentLayoutId = '42';
    
    let selectedSlotIndex = null;
    let cropper = null;
    let draggedSlotIndex = null;

    function applyLanguage() {
      const texts = dict[currentLang];
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (texts[key]) el.textContent = texts[key];
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (texts[key]) el.placeholder = texts[key];
      });

      document.querySelector('option[value="42"]').textContent = texts.layout42;
      document.querySelector('option[value="9"]').textContent = texts.layout9;
      document.querySelector('option[value="25"]').textContent = texts.layout25;

      const titleInput = document.getElementById('titleInput');
      if (titleInput.value === dict.ja.titlePlaceholder || titleInput.value === dict.en.titlePlaceholder || titleInput.value === '') {
        titleInput.value = texts.titlePlaceholder;
        updateTitle();
      }
      
      updateThemeBtnText();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'ja' ? 'en' : 'ja';
      document.getElementById('langLabel').textContent = currentLang === 'ja' ? 'EN' : 'JA';
      applyLanguage();
    }

    function toggleTheme() {
      const body = document.body;
      if (body.classList.contains('light-mode')) {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
      } else {
        body.classList.remove('dark-mode');
        body.classList.add('light-mode');
      }
      updateThemeBtnText();
    }

    function updateThemeBtnText() {
      const isDark = document.body.classList.contains('dark-mode');
      const textSpan = document.querySelector('#themeToggleBtn span');
      textSpan.textContent = isDark ? dict[currentLang].themeDark : dict[currentLang].themeLight;
    }

    function init() {
      applyLanguage();
      buildGrid();
      updateTitle();
    }

    function changeLayout() {
      currentLayoutId = document.getElementById('layoutSelect').value;
      buildGrid();
    }

    function buildGrid() {
      const gridArea = document.getElementById('gridArea');
      gridArea.innerHTML = ''; 
      const config = LAYOUTS[currentLayoutId];
      let slotCounter = 0;

      config.sections.forEach(sec => {
        const sectionDiv = document.createElement('div');
        sectionDiv.className = `grid-section ${sec.className}`;

        for (let i = 0; i < sec.count; i++) {
          const globalIndex = slotCounter;
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.dataset.index = globalIndex;
          slot.id = `slot-${globalIndex}`;

          slot.draggable = true;
          slot.addEventListener('dragstart', handleDragStart);
          slot.addEventListener('dragover', handleDragOver);
          slot.addEventListener('dragleave', handleDragLeave);
          slot.addEventListener('drop', handleDrop);
          slot.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) return;
            openAddModal(globalIndex);
          });

          // 数字表示（ナンバリング）は削除しました

          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.innerHTML = '×';
          delBtn.onclick = (e) => { e.stopPropagation(); removeImage(globalIndex); };
          slot.appendChild(delBtn);

          sectionDiv.appendChild(slot);
          slotCounter++;
        }
        gridArea.appendChild(sectionDiv);
      });
      renderSlots();
    }

    function handleDragStart(e) {
      draggedSlotIndex = parseInt(this.dataset.index);
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleDragOver(e) { e.preventDefault(); this.classList.add('drag-over'); }
    function handleDragLeave() { this.classList.remove('drag-over'); }
    function handleDrop(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      const targetIndex = parseInt(this.dataset.index);

      if (draggedSlotIndex !== null && draggedSlotIndex !== targetIndex) {
        const temp = slotsData[draggedSlotIndex];
        slotsData[draggedSlotIndex] = slotsData[targetIndex];
        slotsData[targetIndex] = temp;
        renderSlots();
      }
    }

    function openAddModal(index = null) {
      const config = LAYOUTS[currentLayoutId];
      if (index === null) {
        for (let i = 0; i < config.total; i++) {
          if (!slotsData[i]) { index = i; break; }
        }
        if (index === null) index = 0;
      }
      selectedSlotIndex = index;
      
      document.getElementById('modalTitle').textContent = dict[currentLang].modalTitle;
      
      document.getElementById('urlInput').value = '';
      document.getElementById('cropBox').style.display = 'none';
      document.getElementById('confirmBtn').style.display = 'none';
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      if (cropper) { cropper.destroy(); cropper = null; }
    }

    async function fetchAndCrop() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return alert(dict[currentLang].alertUrl);

      try {
        const proxyUrl = `${WORKER_URL}/?url=${encodeURIComponent(url)}`;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = proxyUrl;

        await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('Fetch Error')); });

        const cropImg = document.getElementById('cropImage');
        cropImg.src = proxyUrl;

        document.getElementById('cropBox').style.display = 'block';
        document.getElementById('confirmBtn').style.display = 'inline-block';

        if (cropper) cropper.destroy();
        cropper = new Cropper(cropImg, { aspectRatio: 1, viewMode: 1 });
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    function applyCrop() {
      if (!cropper) return;
      const croppedCanvas = cropper.getCroppedCanvas({ width: 400, height: 400 });
      slotsData[selectedSlotIndex] = croppedCanvas;
      renderSlots();
      closeModal();
    }

    function removeImage(index) {
      slotsData[index] = null;
      renderSlots();
    }

    function renderSlots() {
      const config = LAYOUTS[currentLayoutId];
      for (let i = 0; i < config.total; i++) {
        const slot = document.getElementById(`slot-${i}`);
        if (!slot) continue;
        const data = slotsData[i];
        if (data) {
          slot.style.backgroundImage = `url(${data.toDataURL()})`;
          slot.classList.add('has-image');
        } else {
          slot.style.backgroundImage = 'none';
          slot.classList.remove('has-image');
        }
      }
    }

    function updateTitle() {
      document.getElementById('chartTitle').textContent = document.getElementById('titleInput').value || ' ';
    }

    function clearAll() {
      if (confirm(dict[currentLang].alertClear)) {
        const total = LAYOUTS[currentLayoutId].total;
        for (let i = 0; i < total; i++) slotsData[i] = null;
        renderSlots();
      }
    }

    function exportCanvas() {
      const config = LAYOUTS[currentLayoutId];
      const exportCanvas = document.createElement('canvas');
      const ctx = exportCanvas.getContext('2d');
      
      const width = 1200;
      const padding = 40;
      const titleHeight = 90;
      const gap = 12; 
      
      const isDark = document.body.classList.contains('dark-mode');
      const bgColor = isDark ? '#000000' : '#ffffff';
      const textColor = isDark ? '#ffffff' : '#111111';
      const emptyBorder = isDark ? '#222222' : '#cccccc';

      let totalHeight = padding + titleHeight;
      let sectionHeights = [];
      
      config.sections.forEach(sec => {
        const rows = Math.ceil(sec.count / sec.cols);
        const itemW = (width - padding*2 - gap*(sec.cols - 1)) / sec.cols;
        const secH = rows * itemW + (rows - 1) * gap;
        sectionHeights.push({ itemW, secH, rows, cols: sec.cols, count: sec.count });
        totalHeight += secH + gap*2;
      });
      totalHeight += padding - gap*2;

      exportCanvas.width = width;
      exportCanvas.height = totalHeight;

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, width, totalHeight);

      // Canvas上の書き出しフォントのウェイトも 700 に調整
      ctx.fillStyle = textColor;
      ctx.font = '700 42px "Zen Maru Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(document.getElementById('titleInput').value, width / 2, padding + 50);

      let currentY = padding + titleHeight;
      let slotIndex = 0;

      sectionHeights.forEach(secConfig => {
        for (let i = 0; i < secConfig.count; i++) {
          const col = i % secConfig.cols;
          const row = Math.floor(i / secConfig.cols);
          const x = padding + col * (secConfig.itemW + gap);
          const y = currentY + row * (secConfig.itemW + gap);

          if (slotsData[slotIndex]) {
            ctx.drawImage(slotsData[slotIndex], x, y, secConfig.itemW, secConfig.itemW);
          } else {
            ctx.strokeStyle = emptyBorder;
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, secConfig.itemW, secConfig.itemW);
          }
          slotIndex++;
        }
        currentY += secConfig.secH + gap * 2;
      });

      const a = document.createElement('a');
      a.href = exportCanvas.toDataURL('image/png');
      const dlName = document.getElementById('titleInput').value.trim() || 'IllustrationChart';
      a.download = `${dlName}.png`;
      a.click();
    }

    init();
  </script>
</body>
</html>
