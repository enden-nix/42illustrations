<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>42 Illustrations</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet">

<style>
:root {
  --accent: #E85D75;
  --accent-hover: #D94A63;
  --bg-color: #f4f4f4;
  --sidebar-bg: #ffffff;
  --text-color: #333333;
  --border-color: #dddddd;
  --slot-bg: #eaeaea;
  --slot-border: #cccccc;
  --canvas-bg: #ffffff;
}

body.dark-mode {
  --bg-color: #121212;
  --sidebar-bg: #1e1e1e;
  --text-color: #ffffff;
  --border-color: #333333;
  --slot-bg: #262626;
  --slot-border: #444444;
  --canvas-bg: #000000;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Zen Maru Gothic", sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  transition: background-color 0.2s, color 0.2s;
}

.container {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 280px;
  padding: 20px;
  background-color: var(--sidebar-bg);
  border-right: 1px solid var(--border-color);
  flex-shrink: 0;
}

.sidebar h1 {
  margin: 0 0 20px;
  font-size: 24px;
}

.sidebar-section {
  margin-bottom: 20px;
}

.sidebar label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 700;
}

.sidebar input[type="text"],
.sidebar select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: 4px;
  background-color: var(--sidebar-bg);
  color: var(--text-color);
  font-family: inherit;
  font-size: 14px;
}

.sidebar input[type="text"] {
  border-radius: 8px;
}

.sidebar input[type="text"]:focus,
.sidebar select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(232, 93, 117, 0.2);
}

.btn {
  border: none;
  border-radius: 6px;
  padding: 10px 14px;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.1s;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background-color: var(--accent);
  color: #ffffff;
}

.btn-primary:hover {
  background-color: var(--accent-hover);
}

.btn-secondary {
  background-color: transparent;
  color: var(--text-color);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn-danger {
  background-color: #d9534f;
  color: #ffffff;
}

.btn-danger:hover {
  background-color: #c9302c;
}

.button-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toggle-group {
  display: flex;
  gap: 6px;
}

.toggle-group .btn {
  flex: 1;
}

.main {
  flex: 1;
  padding: 30px;
  overflow: auto;
}

.canvas-wrapper {
  max-width: 1200px;
  margin: 0 auto;
}

.title-display {
  margin-bottom: 20px;
  text-align: center;
  font-size: 30px;
  font-weight: 700;
}

.sections {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.slot-grid {
  display: grid;
  gap: 12px;
}

.grid-3x3 {
  grid-template-columns: repeat(3, 1fr);
}

.grid-5x5 {
  grid-template-columns: repeat(5, 1fr);
}

.grid-top {
  grid-template-columns: repeat(5, 1fr);
}

.grid-mid {
  grid-template-columns: repeat(6, 1fr);
}

.grid-bot {
  grid-template-columns: repeat(10, 1fr);
}

.slot {
  aspect-ratio: 1 / 1;
  background-color: var(--slot-bg);
  border: 2px dashed var(--slot-border);
  border-radius: 6px;
  position: relative;
  cursor: pointer;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  transition:
    transform 0.15s,
    border-color 0.2s,
    border-style 0.2s;
}

.slot:hover {
  border-color: var(--accent);
  border-style: solid;
}

.slot:not(.has-image)::after {
  content: '+';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-bottom: 3px;
  font-size: 48px;
  line-height: 1;
  font-weight: 700;
  color: rgba(150, 150, 150, 0.45);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}

.slot:not(.has-image):hover::after {
  opacity: 1;
}

.slot.has-image {
  border: 2px solid transparent;
  cursor: grab;
  background-origin: border-box;
  background-clip: border-box;
}

.slot.has-image:hover {
  border-color: var(--accent);
}

.slot.dragging {
  opacity: 0.5;
}

.slot.drag-over {
  border-color: var(--accent);
  border-style: solid;
}

.modal {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal.show {
  display: flex;
}

.modal-content {
  background-color: var(--sidebar-bg);
  color: var(--text-color);
  border-radius: 10px;
  padding: 24px;
  max-width: 500px;
  width: 90%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
}

.modal-content h2 {
  margin-top: 0;
  margin-bottom: 18px;
}

#urlInput {
  width: 100%;
  padding: 12px 14px;
  font-size: 14px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background-color: var(--sidebar-bg);
  color: var(--text-color);
  font-family: inherit;
}

#urlInput:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(232, 93, 117, 0.2);
}

.modal-url-group {
  display: flex;
  gap: 8px;
  width: 100%;
}

.modal-url-group #urlInput {
  flex: 1;
  min-width: 0;
}

.file-upload {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 12px;
}

.file-upload .btn {
  flex-shrink: 0;
}

.file-upload span {
  color: var(--text-color);
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.upload-or {
  margin: 12px 0;
  text-align: center;
  color: #888888;
  font-size: 13px;
}

.crop-container {
  width: 100%;
  height: 350px;
  margin: 20px 0;
  background: #000000;
  border-radius: 4px;
  overflow: hidden;
}

.crop-container img {
  display: block;
  max-width: 100%;
}

.modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 16px;
}

@media (max-width: 700px) {
  .container {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--border-color);
  }

  .main {
    padding: 15px;
  }

  .grid-bot {
    grid-template-columns: repeat(5, 1fr);
  }
}
</style>
</head>

<body>

<div class="container">

  <aside class="sidebar">

    <h1>42 Illustrations</h1>

    <div class="sidebar-section">
      <label data-i18n="titleLabel">タイトル</label>
      <input
        type="text"
        id="titleInput"
        data-i18n-placeholder="titlePlaceholder"
        placeholder="私を構成するイラスト"
        oninput="updateTitle()"
      >
    </div>

    <div class="sidebar-section">
      <label data-i18n="layoutLabel">レイアウト</label>
      <select id="layoutSelect" onchange="changeLayout()">
        <option value="42" data-i18n="layout42">
          Topsters 42枚 (10 + 12 + 20)
        </option>
        <option value="9" data-i18n="layout9">
          3×3 (9枚)
        </option>
        <option value="25" data-i18n="layout25">
          5×5 (25枚)
        </option>
      </select>
    </div>

    <div class="sidebar-section">
      <label data-i18n="themeLabel">テーマ</label>

      <div class="toggle-group">
        <button
          class="btn btn-secondary"
          onclick="setTheme('light')"
          data-i18n="themeLight"
        >
          ライト
        </button>

        <button
          class="btn btn-secondary"
          onclick="setTheme('dark')"
          data-i18n="themeDark"
        >
          ダーク
        </button>
      </div>
    </div>

    <div class="sidebar-section">
      <label data-i18n="languageLabel">言語</label>

      <div class="toggle-group">
        <button
          class="btn btn-secondary"
          onclick="setLanguage('ja')"
        >
          日本語
        </button>

        <button
          class="btn btn-secondary"
          onclick="setLanguage('en')"
        >
          English
        </button>
      </div>
    </div>

    <div class="sidebar-section button-group">
      <button
        class="btn btn-primary"
        onclick="openAddModal()"
        data-i18n="addBtn"
      >
        画像を追加
      </button>

      <button
        class="btn btn-primary"
        onclick="exportCanvas()"
        data-i18n="exportBtn"
      >
        画像として保存 (PNG)
      </button>

      <button
        class="btn btn-danger"
        onclick="clearAll()"
        data-i18n="clearBtn"
      >
        すべてクリア
      </button>
    </div>

  </aside>

  <main class="main">

    <div class="canvas-wrapper">

      <div
        class="title-display"
        id="titleDisplay"
      >
        私を構成するイラスト
      </div>

      <div
        class="sections"
        id="sections"
      ></div>

    </div>

  </main>

</div>


<!-- 画像追加モーダル -->
<div class="modal" id="addModal">

  <div class="modal-content">

    <h2 data-i18n="modalTitle">
      画像を追加
    </h2>

    <!-- URL -->
    <div class="modal-url-group">
      <input
        type="text"
        id="urlInput"
        data-i18n-placeholder="urlPlaceholder"
        placeholder="X(Twitter) または PixivのURL"
      >

      <button
        class="btn btn-primary"
        onclick="fetchAndCrop()"
        data-i18n="loadBtn"
      >
        読み込む
      </button>
    </div>

    <div class="upload-or" data-i18n="orLabel">
      または
    </div>

    <!-- ローカルファイル -->
    <div class="file-upload">

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        onchange="loadUploadedImage(event)"
        hidden
      >

      <button
        type="button"
        class="btn btn-secondary"
        onclick="document.getElementById('fileInput').click()"
        data-i18n="fileChooseBtn"
      >
        ファイルを選択
      </button>

      <span
        id="fileName"
        data-i18n="fileNoSelected"
      >
        ファイルが選択されていません
      </span>

    </div>

    <!-- Cropper -->
    <div
      class="crop-container"
      id="cropBox"
      style="display:none;"
    >
      <img
        id="cropImage"
        src=""
        alt="Crop preview"
      >
    </div>

    <div class="modal-buttons">

      <button
        class="btn btn-secondary"
        onclick="closeModal()"
        data-i18n="cancelBtn"
      >
        キャンセル
      </button>

      <button
        class="btn btn-primary"
        id="confirmBtn"
        style="display:none;"
        onclick="applyCrop()"
        data-i18n="cropBtn"
      >
        切り抜き確定
      </button>

    </div>

  </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
/* =========================================================
   設定
========================================================= */

const WORKER_URL =
  'https://42illustrations.enden-kpc.workers.dev';


/* =========================================================
   多言語
========================================================= */

const dict = {

  ja: {
    themeLabel: "テーマ",
    themeLight: "ライト",
    themeDark: "ダーク",

    languageLabel: "言語",

    layoutLabel: "レイアウト",
    layout42: "Topsters 42枚 (10 + 12 + 20)",
    layout9: "3×3 (9枚)",
    layout25: "5×5 (25枚)",

    titleLabel: "タイトル",
    titlePlaceholder: "私を構成するイラスト",

    addBtn: "画像を追加",
    exportBtn: "画像として保存 (PNG)",
    clearBtn: "すべてクリア",

    modalTitle: "画像を追加",

    urlPlaceholder:
      "X(Twitter) または PixivのURL",

    loadBtn: "読み込む",

    orLabel: "または",

    fileChooseBtn: "ファイルを選択",
    fileNoSelected: "ファイルが選択されていません",

    cancelBtn: "キャンセル",
    cropBtn: "切り抜き確定",

    alertUrl:
      "URLを入力してください",

    alertClear:
      "現在のレイアウト内の画像をクリアしますか？",

    alertFile:
      "画像ファイルを選択してください"
  },

  en: {
    themeLabel: "Theme",
    themeLight: "Light",
    themeDark: "Dark",

    languageLabel: "Language",

    layoutLabel: "Layout",
    layout42: "Topsters 42 (10 + 12 + 20)",
    layout9: "3×3 (9 images)",
    layout25: "5×5 (25 images)",

    titleLabel: "Title",
    titlePlaceholder: "Illustrations that make me",

    addBtn: "Add Image",
    exportBtn: "Save as PNG",
    clearBtn: "Clear All",

    modalTitle: "Add Image",

    urlPlaceholder:
      "Paste X(Twitter) or Pixiv URL",

    loadBtn: "Load",

    orLabel: "OR",

    fileChooseBtn: "Choose file",
    fileNoSelected: "No file selected",

    cancelBtn: "Cancel",
    cropBtn: "Confirm Crop",

    alertUrl:
      "Please enter a valid URL.",

    alertClear:
      "Clear all images in the current layout?",

    alertFile:
      "Please select an image file."
  }

};


/* =========================================================
   レイアウト
========================================================= */

const LAYOUTS = {

  '9': {
    total: 9,
    sections: [
      {
        count: 9,
        cols: 3,
        className: 'grid-3x3'
      }
    ]
  },

  '25': {
    total: 25,
    sections: [
      {
        count: 25,
        cols: 5,
        className: 'grid-5x5'
      }
    ]
  },

  '42': {
    total: 42,
    sections: [
      {
        count: 10,
        cols: 5,
        className: 'grid-top'
      },
      {
        count: 12,
        cols: 6,
        className: 'grid-mid'
      },
      {
        count: 20,
        cols: 10,
        className: 'grid-bot'
      }
    ]
  }

};


/* =========================================================
   状態
========================================================= */

const MAX_SLOTS = 42;

let slotsData =
  new Array(MAX_SLOTS).fill(null);

let currentLayoutId = '42';

let selectedSlotIndex = null;

let cropper = null;

let draggedSlotIndex = null;

let currentLang = 'ja';


/* =========================================================
   初期化
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  () => {

    renderSlots();

    updateTitle();

    applyLanguage();

  }
);


/* =========================================================
   タイトル
========================================================= */

function updateTitle() {

  const input =
    document.getElementById('titleInput');

  const display =
    document.getElementById('titleDisplay');

  let title = input.value.trim();

  if (!title) {
    title =
      dict[currentLang].titlePlaceholder;
  }

  display.textContent = title;
}


/* =========================================================
   言語変更
========================================================= */

function setLanguage(lang) {

  currentLang = lang;

  applyLanguage();

  updateTitle();

  const fileInput =
    document.getElementById('fileInput');

  const fileName =
    document.getElementById('fileName');

  if (
    fileInput &&
    fileName &&
    !fileInput.files.length
  ) {
    fileName.textContent =
      dict[currentLang].fileNoSelected;
  }
}


function applyLanguage() {

  document
    .querySelectorAll('[data-i18n]')
    .forEach(element => {

      const key =
        element.getAttribute('data-i18n');

      if (dict[currentLang][key]) {
        element.textContent =
          dict[currentLang][key];
      }

    });


  document
    .querySelectorAll('[data-i18n-placeholder]')
    .forEach(element => {

      const key =
        element.getAttribute(
          'data-i18n-placeholder'
        );

      if (dict[currentLang][key]) {
        element.placeholder =
          dict[currentLang][key];
      }

    });

}


/* =========================================================
   テーマ
========================================================= */

function setTheme(theme) {

  if (theme === 'dark') {
    document.body.classList.add('dark-mode');
  } else {
    document.body.classList.remove('dark-mode');
  }

}


/* =========================================================
   レイアウト変更
========================================================= */

function changeLayout() {

  currentLayoutId =
    document.getElementById(
      'layoutSelect'
    ).value;

  renderSlots();

}


/* =========================================================
   スロット描画
========================================================= */

function renderSlots() {

  const container =
    document.getElementById('sections');

  container.innerHTML = '';

  const layout =
    LAYOUTS[currentLayoutId];

  let slotIndex = 0;

  layout.sections.forEach(sectionConfig => {

    const section =
      document.createElement('div');

    section.className =
      'slot-grid ' +
      sectionConfig.className;

    for (
      let i = 0;
      i < sectionConfig.count;
      i++
    ) {

      const index = slotIndex++;

      const slot =
        document.createElement('div');

      slot.className = 'slot';

      slot.dataset.index = index;

      slot.addEventListener(
        'click',
        () => {

          if (draggedSlotIndex !== null) {
            return;
          }

          if (slotsData[index]) {
            openAddModal(index);
          } else {
            openAddModal(index);
          }

        }
      );


      /* ドラッグ */
      slot.draggable =
        !!slotsData[index];

      slot.addEventListener(
        'dragstart',
        event => {

          draggedSlotIndex = index;

          slot.classList.add(
            'dragging'
          );

          event.dataTransfer.effectAllowed =
            'move';

        }
      );


      slot.addEventListener(
        'dragend',
        () => {

          draggedSlotIndex = null;

          slot.classList.remove(
            'dragging'
          );

        }
      );


      slot.addEventListener(
        'dragover',
        event => {

          event.preventDefault();

          if (
            draggedSlotIndex !== null &&
            draggedSlotIndex !== index
          ) {
            slot.classList.add(
              'drag-over'
            );
          }

        }
      );


      slot.addEventListener(
        'dragleave',
        () => {

          slot.classList.remove(
            'drag-over'
          );

        }
      );


      slot.addEventListener(
        'drop',
        event => {

          event.preventDefault();

          slot.classList.remove(
            'drag-over'
          );

          if (
            draggedSlotIndex === null ||
            draggedSlotIndex === index
          ) {
            return;
          }

          const temp =
            slotsData[index];

          slotsData[index] =
            slotsData[draggedSlotIndex];

          slotsData[draggedSlotIndex] =
            temp;

          renderSlots();

        }
      );


      if (slotsData[index]) {

        slot.style.backgroundImage =
          `url(${slotsData[index].toDataURL()})`;

        slot.classList.add(
          'has-image'
        );

      }


      section.appendChild(slot);

    }

    container.appendChild(section);

  });

}


/* =========================================================
   モーダル
========================================================= */

function openAddModal(index = null) {

  if (index === null) {

    index =
      slotsData
        .slice(
          0,
          LAYOUTS[currentLayoutId].total
        )
        .findIndex(
          item => item === null
        );

    if (index === -1) {
      index = 0;
    }

  }

  selectedSlotIndex = index;

  document
    .getElementById('urlInput')
    .value = '';

  document
    .getElementById('fileInput')
    .value = '';

  document
    .getElementById('fileName')
    .textContent =
      dict[currentLang].fileNoSelected;

  document
    .getElementById('cropBox')
    .style.display = 'none';

  document
    .getElementById('confirmBtn')
    .style.display = 'none';

  if (cropper) {
    cropper.destroy();
    cropper = null;
  }

  document
    .getElementById('addModal')
    .classList.add('show');

}


function closeModal() {

  document
    .getElementById('addModal')
    .classList.remove('show');

  if (cropper) {
    cropper.destroy();
    cropper = null;
  }

}


/* =========================================================
   URLから画像読み込み
========================================================= */

async function fetchAndCrop() {

  const url =
    document
      .getElementById('urlInput')
      .value
      .trim();

  if (!url) {
    alert(dict[currentLang].alertUrl);
    return;
  }

  try {

    const proxyUrl =
      `${WORKER_URL}/?url=${encodeURIComponent(url)}`;

    const img =
      new Image();

    img.crossOrigin =
      'anonymous';

    img.src =
      proxyUrl;

    await new Promise(
      (resolve, reject) => {

        img.onload =
          resolve;

        img.onerror =
          () => reject(
            new Error('Fetch Error')
          );

      }
    );

    loadImageIntoCropper(
      proxyUrl
    );

  } catch (e) {

    alert(
      'Error: ' + e.message
    );

  }

}


/* =========================================================
   Cropper初期化
========================================================= */

function loadImageIntoCropper(src) {

  const cropImg =
    document.getElementById(
      'cropImage'
    );

  if (cropper) {

    cropper.destroy();

    cropper = null;

  }

  cropImg.crossOrigin =
    'anonymous';

  cropImg.onload =
    () => {

      document
        .getElementById('cropBox')
        .style.display = 'block';

      document
        .getElementById('confirmBtn')
        .style.display = 'inline-block';

      cropper =
        new Cropper(
          cropImg,
          {
            aspectRatio: 1,
            viewMode: 1,
            autoCropArea: 1,
            responsive: true
          }
        );

    };

  cropImg.src = src;

}


/* =========================================================
   ローカル画像読み込み
========================================================= */

function loadUploadedImage(event) {

  const file =
    event.target.files[0];

  const fileName =
    document.getElementById(
      'fileName'
    );

  if (!file) {

    fileName.textContent =
      dict[currentLang].fileNoSelected;

    return;

  }

  fileName.textContent =
    file.name;

  if (!file.type.startsWith('image/')) {

    alert(
      dict[currentLang].alertFile
    );

    event.target.value = '';

    fileName.textContent =
      dict[currentLang].fileNoSelected;

    return;

  }

  const reader =
    new FileReader();

  reader.onload =
    function(e) {

      loadImageIntoCropper(
        e.target.result
      );

    };

  reader.readAsDataURL(file);

}


/* =========================================================
   Crop確定
========================================================= */

function applyCrop() {

  if (!cropper) {
    return;
  }

  const croppedCanvas =
    cropper.getCroppedCanvas(
      {
        width: 400,
        height: 400,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high'
      }
    );

  slotsData[selectedSlotIndex] =
    croppedCanvas;

  renderSlots();

  closeModal();

}


/* =========================================================
   全消去
========================================================= */

function clearAll() {

  if (
    !confirm(
      dict[currentLang].alertClear
    )
  ) {
    return;
  }

  slotsData =
    new Array(MAX_SLOTS).fill(null);

  renderSlots();

}


/* =========================================================
   PNG出力
========================================================= */

function exportCanvas() {

  const layout =
    LAYOUTS[currentLayoutId];

  const width = 1200;

  const padding = 40;

  const titleHeight = 90;

  const gap = 12;

  /*
   * まず全体の高さを計算する。
   * セルサイズ自体は元の計算方法を維持する。
   */
  let currentY =
    padding + titleHeight;

  const sectionInfo = [];

  layout.sections.forEach(
    sectionConfig => {

      const rawItemW =
        (
          width -
          padding * 2 -
          gap *
            (sectionConfig.cols - 1)
        ) /
        sectionConfig.cols;

      const rawHeight =
        rawItemW *
        Math.ceil(
          sectionConfig.count /
          sectionConfig.cols
        );

      const sectionHeight =
        rawHeight +
        gap *
        (
          Math.ceil(
            sectionConfig.count /
            sectionConfig.cols
          ) - 1
        );

      sectionInfo.push(
        {
          config: sectionConfig,
          rawItemW: rawItemW,
          startY: currentY,
          sectionHeight: sectionHeight
        }
      );

      currentY +=
        sectionHeight + gap;

    }
  );

  const height =
    Math.ceil(
      currentY -
      gap +
      padding
    );


  const canvas =
    document.createElement('canvas');

  canvas.width =
    width;

  canvas.height =
    height;

  const ctx =
    canvas.getContext('2d');


  /* 背景 */

  const dark =
    document.body.classList.contains(
      'dark-mode'
    );

  const bgColor =
    dark
      ? '#000000'
      : '#ffffff';

  const textColor =
    dark
      ? '#ffffff'
      : '#333333';

  const emptyBorder =
    dark
      ? '#222222'
      : '#cccccc';

  ctx.fillStyle =
    bgColor;

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /* タイトル */

  const title =
    document
      .getElementById('titleInput')
      .value
      .trim() ||
    dict[currentLang].titlePlaceholder;

  ctx.fillStyle =
    textColor;

  ctx.font =
    '700 42px "Zen Maru Gothic", sans-serif';

  ctx.textAlign =
    'center';

  ctx.textBaseline =
    'middle';

  ctx.fillText(
    title,
    width / 2,
    padding + titleHeight / 2
  );


  /*
   * 画像描画
   *
   * x / y / width / height を整数化する。
   * 小数ピクセルへのdrawImageによる境界線を防ぐ。
   */
  let slotIndex = 0;

  sectionInfo.forEach(
    info => {

      const config =
        info.config;

      const rawItemW =
        info.rawItemW;

      const rows =
        Math.ceil(
          config.count /
          config.cols
        );

      for (
        let row = 0;
        row < rows;
        row++
      ) {

        for (
          let col = 0;
          col < config.cols;
          col++
        ) {

          if (
            row * config.cols + col >=
            config.count
          ) {
            break;
          }

          const index =
            slotIndex++;

          /*
           * 左右の境界をそれぞれ丸めてから
           * 幅を差分で求める。
           *
           * これにより、例えば
           * 192.4px + 192.4px ...
           * のような小数ピクセルによる
           * 1px程度の線を避ける。
           */
          const x1 =
            Math.round(
              padding +
              col *
                (rawItemW + gap)
            );

          const x2 =
            Math.round(
              padding +
              col *
                (rawItemW + gap) +
              rawItemW
            );

          const y1 =
            Math.round(
              info.startY +
              row *
                (rawItemW + gap)
            );

          const y2 =
            Math.round(
              info.startY +
              row *
                (rawItemW + gap) +
              rawItemW
            );

          const drawW =
            x2 - x1;

          const drawH =
            y2 - y1;


          if (slotsData[index]) {

            /*
             * セル境界内だけに描画する。
             */
            ctx.save();

            ctx.beginPath();

            ctx.rect(
              x1,
              y1,
              drawW,
              drawH
            );

            ctx.clip();

            ctx.drawImage(
              slotsData[index],
              x1,
              y1,
              drawW,
              drawH
            );

            ctx.restore();

          } else {

            ctx.strokeStyle =
              emptyBorder;

            ctx.lineWidth =
              1;

            ctx.strokeRect(
              x1 + 0.5,
              y1 + 0.5,
              drawW - 1,
              drawH - 1
            );

          }

        }

      }

    }
  );


  /* ダウンロード */

  const safeTitle =
    title.replace(
      /[\\/:*?"<>|]/g,
      '_'
    );

  const link =
    document.createElement('a');

  link.download =
    `${safeTitle}.png`;

  link.href =
    canvas.toDataURL('image/png');

  link.click();

}
</script>
